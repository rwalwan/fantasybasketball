name = "lock-desk"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

# Created by `npx wrangler kv namespace create KV`; the id is filled in at setup.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# WRITE_KEY is a secret (npx wrangler secret put WRITE_KEY); the site sends it to save answers.
