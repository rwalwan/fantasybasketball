name = "lock-desk"
main = "src/index.js"
account_id = "9c9ae6872597b6d0ff6246a94028ec4b"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

# KV namespace for lineup snapshots and answers.
[[kv_namespaces]]
