name: Other Lock-In leagues

on:
  schedule:
    - cron: "7 15 * * *"      # daily, 8:07 AM PT - before any tip-off
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lock-desk
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch saved state
        run: tools/state.sh restore
      - name: Cache Sleeper data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sleeper-${{ github.run_id }}
          restore-keys: sleeper-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover, snapshot, verify, study
        run: python -m app.league_run
      - name: Save state
        run: tools/state.sh save
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
