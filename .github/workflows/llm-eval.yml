name: AI model eval

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lock-desk
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch saved state
        run: |
          mkdir -p data/state
          git fetch --depth 1 origin state && git archive FETCH_HEAD | tar -x -C data/state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model comparison
        run: python tools/llm_eval.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Save result to the state branch
        run: |
          cd data/state
          git init -q -b state
          git config user.name "lock-desk-bot"
          git config user.email "lock-desk-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "llm eval $(date -u +%FT%TZ)" || exit 0
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" state
