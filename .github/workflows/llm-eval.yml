name: AI model eval

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lock-desk
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch saved state
        run: tools/state.sh restore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model comparison
        run: python tools/llm_eval.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Save result to the state branch
        run: tools/state.sh save
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
