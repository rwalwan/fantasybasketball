name: Update Lock Desk

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (UTC); GitHub may delay runs by a few minutes
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lock-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch saved state (lineup snapshots, overrides)
        run: |
          mkdir -p data/state
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state
            git archive FETCH_HEAD | tar -x -C data/state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        run: python -m app.run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKER_URL: ${{ vars.WORKER_URL }}

      - name: Save state to the state branch
        run: |
          cd data/state
          git init -q -b state
          git config user.name "lock-desk-bot"
          git config user.email "lock-desk-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "state $(date -u +%FT%TZ)" || exit 0
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" state

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
