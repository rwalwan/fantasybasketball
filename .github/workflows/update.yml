name: Update Lock Desk

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (UTC); GitHub may delay runs by a few minutes
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lock-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch saved state (fails the run rather than continuing on empty state)
        run: tools/state.sh restore

      - name: Cache Sleeper data (finished weeks never change)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sleeper-${{ github.run_id }}
          restore-keys: sleeper-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        run: python -m app.run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_ADVICE: ${{ vars.OPENROUTER_MODEL_ADVICE }}
          OPENROUTER_MODEL_NEWS: ${{ vars.OPENROUTER_MODEL_NEWS }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Suggested moves (+ AI reasons)
        run: tools/step.sh moves node tools/moves.mjs
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

      - name: Decision log + grading
        run: tools/step.sh learn python -m app.learn
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}

      - name: Phone alerts
        run: tools/step.sh alerts python -m app.alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Site health check (headless Chrome)
        run: |
          (cd site && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 1
          timeout 90 google-chrome --headless=new --disable-gpu --no-sandbox --enable-logging=stderr --v=0 \
            --virtual-time-budget=25000 --dump-dom "http://localhost:8099/#api=${{ vars.WORKER_URL }}" > /tmp/dom.html 2> /tmp/console.txt || true
          python3 tools/site_check.py /tmp/dom.html /tmp/console.txt > data/state/site_check.json || echo '{"error":"check failed"}' > data/state/site_check.json
          cat data/state/site_check.json
          timeout 60 google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=390,3200 --virtual-time-budget=25000 --screenshot=data/state/mobile.png "http://localhost:8099/#api=${{ vars.WORKER_URL }}" >/dev/null 2>&1 || true

      - name: Save state to the state branch (daily copy kept on state-backup)
        run: tools/state.sh save
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
